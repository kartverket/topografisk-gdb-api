services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: geocomp
      POSTGRES_PASSWORD: geocomp
      POSTGRES_DB: geocomp
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U geocomp"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
