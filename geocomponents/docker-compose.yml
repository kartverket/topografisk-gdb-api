services:
  db:
    image: imresamu/postgis:17-3.6-alpine
    environment:
      POSTGRES_USER: geocomponents
      POSTGRES_PASSWORD: geocomponents
      POSTGRES_DB: geocomponents
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U geocomponents"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:8-alpine
    ports:
      - "56379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - redisdata:/data

volumes:
  pgdata:
  redisdata:
