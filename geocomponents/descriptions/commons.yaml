# Shared definitions every collection in every dataset inherits from.
# (id / geometry / created_at / updated_at columns are always added by the
# schema builder; base_fields below are *extra* shared attributes.)

base_fields:
  - name: source
    type: string
    description: Origin/provenance of the feature.

field_types:
  - name: municipality_code
    sql_type: varchar(4)
    description: Four-digit municipality identifier.

code_lists:
  - name: parcel_status
    values:
      - code: active
        label: Active
      - code: retired
        label: Retired
