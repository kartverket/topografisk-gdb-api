name: EksempelDatasett
srid: 4326
title: Example simple features
description: Simple features with and without a projected identifier.
processes:
  - upsert-batch

collections:
  - name: with_oi
    title: With OI
    description: ''
    geometry:
      type: LineString
    outward_identifier: identification.testoi
    fields:
      - name: label
        type: string
        max_length: 4
      - name: identification
        type: object
        required: true
        fields:
          - name: testoi
            type: string

  - name: NårwegiænØbject
    title: Example object
    description: 'Simple feature with norwegian letters and camelCase'
    geometry:
      type: LineString
    fields:
      - name: feltØ
        type: string
        indexable: true
      - name: egenskaper
        type: object
        fields:
          - name: verdiÅ
            type: integer
            indexable: true
