#   docker compose up --build   -> db + migrate (apply-schema) + api (serve)
#   docker compose up db        -> just the database
#
# Point at a different descriptions folder without editing this file:
#   DESCRIPTIONS_DIR=/path/to/my-descriptions docker compose up --build
services:
  migrate:                       # local analog of the K8s apply-schema Job
    build: .
    command: ["apply-schema"]
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: geocomponents
      DB_USER: geocomponents
      DB_PASSWORD: geocomponents
      GEOCOMPONENTS_DESCRIPTIONS: /app/descriptions
    volumes:
      - ./src:/app/src:ro
      - type: bind
        source: ${DESCRIPTIONS_DIR:-../descriptions}
        target: /app/descriptions
        read_only: true
    depends_on:
      db:
        condition: service_healthy

  api:                           # local analog of the serve Deployment
    build: .
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: geocomponents
      DB_USER: geocomponents
      DB_PASSWORD: geocomponents
      GEOCOMPONENTS_DESCRIPTIONS: /app/descriptions
      GEOCOMPONENTS_BASE_URL: http://localhost:8000
    volumes:
      - ./src:/app/src:ro
      - type: bind
        source: ${DESCRIPTIONS_DIR:-../descriptions}
        target: /app/descriptions
        read_only: true
    ports:
      - "8000:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"
      interval: 3s
      timeout: 3s
      retries: 20
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  gcimport:
    build: ../gcimport
    environment:
      GEOCOMPONENTS_API_URL: http://api:8000
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8001:8000"
    volumes:
      - ../gcimport/src:/app/src:ro
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy

  gcapi:
    build: ../gcapi
    environment:
      GCAPI_PUBLIC_URL: http://localhost:8004
      GCAPI_GEOCOMPONENTS_URL: http://api:8000
      GCAPI_GCJOBS_URL: http://gcjobs:8000
    ports:
      - "8004:8000"
    volumes:
      - ../gcapi/src:/app/src:ro
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"
      interval: 3s
      timeout: 3s
      retries: 20
    depends_on:
      api:
        condition: service_healthy
      gcjobs:
        condition: service_healthy

  gcmapview:
    build: ../gcmapview
    environment:
      GCAPI_API_URL: http://localhost:8004
    read_only: true
    ports:
      - "8080:80"
    depends_on:
      gcapi:
        condition: service_healthy

  gccore-migrate:
    build: ../gccore
    command: ["migrate-db"]
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: geocomponents
      DB_USER: geocomponents
      DB_PASSWORD: geocomponents
    volumes:
      - ../gccore/src:/app/src:ro
    depends_on:
      db:
        condition: service_healthy

  gccore:
    build: ../gccore
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: geocomponents
      DB_USER: geocomponents
      DB_PASSWORD: geocomponents
    ports:
      - "8002:8000"
    volumes:
      - ../gccore/src:/app/src:ro
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"
      interval: 3s
      timeout: 3s
      retries: 20
    depends_on:
      db:
        condition: service_healthy
      gccore-migrate:
        condition: service_completed_successfully

  gcjobs-migrate:
    build: ../gcjobs
    command: ["migrate-db"]
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: geocomponents
      DB_USER: geocomponents
      DB_PASSWORD: geocomponents
    volumes:
      - ../gcjobs/src:/app/src:ro
    depends_on:
      db:
        condition: service_healthy

  gcjobs:
    build: ../gcjobs
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: geocomponents
      DB_USER: geocomponents
      DB_PASSWORD: geocomponents
      GEOCOMPONENTS_DESCRIPTIONS: /app/descriptions
      GCJOBS_IMPORT_API_URL: http://gcimport:8000
      GCJOBS_API_BASE_URL: http://localhost:8004
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8003:8000"
    volumes:
      - ../gcjobs/src:/app/src:ro
      - type: bind
        source: ${DESCRIPTIONS_DIR:-../descriptions}
        target: /app/descriptions
        read_only: true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"
      interval: 3s
      timeout: 3s
      retries: 20
    depends_on:
      db:
        condition: service_healthy
      gcimport:
        condition: service_started
      redis:
        condition: service_healthy
      gcjobs-migrate:
        condition: service_completed_successfully
