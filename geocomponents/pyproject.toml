[project]
name = "geocomp"
version = "0.1.0"
description = "Description-driven, swappable components for storing, distributing and updating geographic data"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pygeoapi>=0.18",
    "psycopg[binary]>=3.1",
    "pydantic>=2.6",
    "orjson>=3.9",
    "pyyaml>=6.0",
    "typer>=0.12",
]

[project.scripts]
geocomp = "geocomp.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/geocomp"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
