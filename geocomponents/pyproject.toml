[project]
name = "geocomponents"
version = "0.1.0"
description = "Description-driven, swappable components for storing, distributing and updating geographic data"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pygeoapi>=0.18",
    "psycopg[binary]>=3.1",
    "pydantic>=2.6",
    "orjson>=3.9",
    "pyyaml>=6.0",
    "typer>=0.12",
]

[project.scripts]
geocomponents = "geocomponents.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx2>=2.5",
    "ruff>=0.15",
    "pre-commit>=4.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/geocomponents"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
]

# Same as Black.
line-length = 88
indent-width = 4
target-version = "py312"

[tool.ruff.lint]
select = [
    # --- Correctness / bug-likelihood ---
    "F",       # Pyflakes: undefined names, unused imports, etc.
    "E4",      # pycodestyle: import formatting errors
    "E7",      # pycodestyle: statement errors (multiple statements, ==None, ...)
    "E9",      # pycodestyle: syntax / IO errors
    "B",       # flake8-bugbear: likely bugs and design smells
    "RUF",     # Ruff-specific: mutable class attrs, useless comprehensions, ...
    "SIM",     # flake8-simplify: collapse redundant constructs
    "RET",     # flake8-return: cleanup return/raise flow
    "C4",      # flake8-comprehensions: drop needless list()/dict()/set() wraps
    "PIE",     # flake8-pie: misc small correctness lints
    # --- Security ---
    "S",       # flake8-bandit: subprocess, hardcoded creds, SQLi, yaml.load, ...
    # --- Style / consistency ---
    "I",       # isort: import ordering (auto-fixable)
    "UP",      # pyupgrade: modernize syntax for target Python (auto-fixable)
    "N",       # pep8-naming
    "A",       # flake8-builtins: shadowing builtins
    "Q",       # flake8-quotes: consistent quoting
    "TID",     # flake8-tidy-imports: ban relative parent imports
    "T20",     # flake8-print: no stray print()/pprint()
    # --- Ecosystem-specific ---
    "DTZ",     # flake8-datetimez: enforce timezone-aware datetimes
    "PTH",     # flake8-use-pathlib: prefer pathlib over os.path
    "NPY",     # numpy-specific
    "PD",      # pandas-vet
    # --- Refactor hints ---
    "PLR",     # pylint refactor (magic values, complexity, ...)
]
ignore = []

# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "S101",     # assert in pytest
    "S105",     # hardcoded password-like strings (fixture creds)
    "S106",     # hardcoded password kwarg (fixture creds)
    "PLR2004",  # magic numbers are readable in test data
    "T201",     # print() is fine when debugging a failing test
]

[tool.ruff.format]
# Like Black, use double quotes for strings.
quote-style = "double"

# Like Black, indent with spaces, rather than tabs.
indent-style = "space"

# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = false

# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"

# Enable auto-formatting of code examples in docstrings. Markdown,
# reStructuredText code/literal blocks and doctests are all supported.
#
# This is currently disabled by default, but it is planned for this
# to be opt-out in the future.
docstring-code-format = false

# Set the line length limit used when formatting code snippets in
# docstrings.
#
# This only has an effect when the `docstring-code-format` setting is
# enabled.
docstring-code-line-length = "dynamic"
