[project]
name = "gcimport"
version = "0.1.0"
description = "Profile-driven JSON-FG importer for geocomponents datasets"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.116",
    "httpx>=0.28",
    "orjson>=3.10",
    "pydantic>=2.11",
    "pyproj>=3.7",
    "python-multipart>=0.0.20",
    "uvicorn>=0.35",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=1.0",
    "ruff==0.16.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
geojson-to-jsonfg = "gcimport.geojson_to_jsonfg:main"

[tool.hatch.build.targets.wheel]
packages = ["src/gcimport"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
indent-width = 4
target-version = "py312"

[tool.ruff.lint]
select = [
    "F",
    "E4",
    "E7",
    "E9",
    "B",
    "RUF",
    "SIM",
    "RET",
    "C4",
    "PIE",
    "S",
    "I",
    "UP",
    "N",
    "A",
    "Q",
    "TID",
    "T20",
    "DTZ",
    "PTH",
    "PLR",
]
ignore = []
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004"]
"src/gcimport/geojson_to_jsonfg.py" = ["T20"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
