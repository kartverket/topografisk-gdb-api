default_install_hook_types: [pre-commit]

# Files under these paths are reference material or generated dumps; not code we
# own or need to lint / format.
exclude: |
  (?x)^(
    UML-schemas/.*|
    ogc-standards/.*|
    nibio/.*\.sql|
    geocomponents/tmp_descriptions/.*
  )$

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.0
    hooks:
      - id: ruff-check
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=1024]

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.7
    hooks:
      - id: actionlint

  # Drift guard: ensure geocomponents ruff == pre-commit ruff.
  # `language: system` + explicit `python3` avoids depending on the script's
  # exec bit / shebang and works with any python3 on PATH (stdlib-only script).
  - repo: local
    hooks:
      - id: ruff-versions-in-sync
        name: ruff versions in sync
        language: system
        entry: python3 scripts/check_ruff_versions.py
        files: '^(\.pre-commit-config\.yaml|geocomponents/pyproject\.toml)$'
        pass_filenames: false
