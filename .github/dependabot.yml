version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: pre-commit
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3

  - package-ecosystem: uv
    directory: /geocomponents
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      dev-dependencies:
        dependency-type: development

  # Base images in geocomponents/Dockerfile (python:3.12-slim) and the postgis
  # service image in geocomponents/docker-compose.yml. Trivy scans the built
  # image on every PR; these PRs are the proactive fix path for the CVEs Trivy
  # would otherwise flag.
  - package-ecosystem: docker
    directory: /geocomponents
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
